# Scrape targets are added as services gain /metrics endpoints (M4+).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pipeline services (profile "pipeline"). DNS discovery finds every replica.
  - job_name: simulator
    dns_sd_configs:
      - names: ["simulator"]
        type: A
        port: 9101
  - job_name: normalizer
    dns_sd_configs:
      - names: ["normalizer"]
        type: A
        port: 9102
