# =============================================================================
# Prognos — local stack
#
#   docker compose up -d                          # core data plane
#   docker compose --profile observability up -d  # + Prometheus & Grafana
#   docker compose -f docker-compose.yml -f infra/docker/compose.kafka-ha.yml up -d
#                                                 # 3-broker Kafka (chaos tests)
#
# Memory limits are sized so the core stack fits in a 5 GB Docker VM
# (8 GB MacBook Air). Application services are added in later milestones.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-prognos}

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Messaging — Kafka in KRaft mode (no ZooKeeper). ADR-001.
  # ---------------------------------------------------------------------------
  kafka:
    <<: *restart
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared in kafka/topics
      KAFKA_NUM_PARTITIONS: ${KAFKA_TELEMETRY_PARTITIONS:-6}
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # One-shot job: creates topics idempotently from kafka/topics/topics.conf
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TELEMETRY_PARTITIONS: ${KAFKA_TELEMETRY_PARTITIONS:-6}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      KAFKA_TELEMETRY_RETENTION_MS: ${KAFKA_TELEMETRY_RETENTION_MS:-86400000}
    volumes:
      - ./kafka/topics:/topics:ro
    restart: "no"

  # ---------------------------------------------------------------------------
  # Relational core — PostgreSQL (tenants, vehicles, alerts, work orders, audit). ADR-003.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # Telemetry / analytics — ClickHouse (columnar, TTL tiering). ADR-002.
  # ---------------------------------------------------------------------------
  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:25.8-alpine
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-prognos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/docker/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1536m

  # ---------------------------------------------------------------------------
  # Latest vehicle state, dedup windows, rate limits, WebSocket fan-out.
  # ---------------------------------------------------------------------------
  redis:
    <<: *restart
    image: redis:7.4-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction          # state must not be silently evicted; fail loudly instead
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 384m

  # ---------------------------------------------------------------------------
  # Telemetry pipeline (opt-in profile: needs a seeded database)
  #   make seed && make pipeline
  # The simulator and the seeded database must use the same VEHICLE_COUNT,
  # TENANT_COUNT and SIM_SEED, or the normalizer rejects every VIN as unknown.
  # ---------------------------------------------------------------------------
  simulator:
    <<: *restart
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
      secrets: [extra_ca]
    image: prognos/simulator:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      VEHICLE_COUNT: ${VEHICLE_COUNT:-10000}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-10000}
      SIM_WORKERS: ${SIM_WORKERS:-2}
      TENANT_COUNT: ${TENANT_COUNT:-20}
      SEED: ${SIM_SEED:-42}
      BURST_MULTIPLIER: ${BURST_MULTIPLIER:-3}
      BURST_START_SECONDS: ${BURST_START_SECONDS:--1}
      BURST_DURATION_SECONDS: ${BURST_DURATION_SECONDS:-300}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.01}
      OUT_OF_ORDER_RATE: ${OUT_OF_ORDER_RATE:-0.02}
      MALFORMED_RATE: ${MALFORMED_RATE:-0.005}
      MISSING_FIELD_RATE: ${MISSING_FIELD_RATE:-0.01}
      FAULT_RATE: ${FAULT_RATE:-0.01}
      FAULT_TIME_SCALE: ${FAULT_TIME_SCALE:-1}
      SCENARIO: ${SIM_SCENARIO:-none}
      PUBLISHER: kafka
      MODE: live
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SIM_METRICS_HOST_PORT:-9101}:9101"
    stop_grace_period: 30s   # workers release held-back events and flush on SIGTERM
    deploy:
      resources:
        limits:
          memory: 768m

  # Scale out with NORMALIZER_REPLICAS (<= telemetry.raw partitions).
  normalizer:
    <<: *restart
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
      secrets: [extra_ca]
    image: prognos/stream:local
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate-postgres:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NORMALIZER_BATCH_SIZE: ${NORMALIZER_BATCH_SIZE:-2000}
      REGISTRY_REFRESH_SECONDS: ${REGISTRY_REFRESH_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s   # finishes the batch, flushes, commits offsets
    deploy:
      replicas: ${NORMALIZER_REPLICAS:-2}
      resources:
        limits:
          memory: 384m

  # Real-time detection: telemetry.canonical -> alerts + vehicle.state
  detector:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/stream:local
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
      secrets: [extra_ca]
    entrypoint: ["prognos-detector"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      DETECTOR_BATCH_SIZE: ${DETECTOR_BATCH_SIZE:-2000}
      STATE_INTERVAL_SECONDS: ${STATE_INTERVAL_SECONDS:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s
    deploy:
      replicas: ${DETECTOR_REPLICAS:-1}
      resources:
        limits:
          memory: 512m

  # Persistence: alerts -> PostgreSQL (+ Redis pub/sub); vehicle.state -> Redis.
  # (Telemetry reaches ClickHouse through its own Kafka engine, see database/telemetry.)
  sink:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/stream:local
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
      secrets: [extra_ca]
    entrypoint: ["prognos-sink"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate-postgres:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SINK_RETRY_BUDGET_SECONDS: ${SINK_RETRY_BUDGET_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # Maintenance planner: open alerts -> calibrated risk -> proposed work orders.
  planner:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/stream:local
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
      secrets: [extra_ca]
    entrypoint: ["prognos-planner"]
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PLANNER_INTERVAL_SECONDS: ${PLANNER_INTERVAL_SECONDS:-60}
      PLANNER_HORIZON_DAYS: ${PLANNER_HORIZON_DAYS:-7}
      PLANNER_RISK_SOURCE: ${PLANNER_RISK_SOURCE:-rules}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 256m

  # Emerging-fault radar: telemetry.canonical -> fleet.signals (single consumer: whole fleet).
  radar:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/stream:local
    build:
      context: .
      dockerfile: apps/stream-processor/Dockerfile
      secrets: [extra_ca]
    entrypoint: ["prognos-radar"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate-postgres:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RADAR_WINDOW_SECONDS: ${RADAR_WINDOW_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  # Live 7-day failure risk (LightGBM) for every vehicle -> Redis ranking + ClickHouse history.
  scorer:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/ml:local
    build:
      context: .
      dockerfile: ml/Dockerfile
      secrets: [extra_ca]
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
      migrate-clickhouse:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-prognos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCORER_INTERVAL_SECONDS: ${SCORER_INTERVAL_SECONDS:-300}
      SCORER_SHARDS: ${SCORER_SHARDS:-1}
      SCORER_LAG_SECONDS: ${SCORER_LAG_SECONDS:-120}
      SCORER_MIN_EVENTS: ${SCORER_MIN_EVENTS:-30}
      SCORER_MIN_MINUTES: ${SCORER_MIN_MINUTES:-45}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 768m

  # REST + WebSocket API (http://localhost:8000/docs).
  api:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets: [extra_ca]
    depends_on:
      migrate-postgres:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-prognos}
      POSTGRES_USER: ${POSTGRES_USER:-prognos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-prognos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RISK_SOURCE: ${RISK_SOURCE:-rules}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 256m

  # Dashboard (http://localhost:8080): static build + same-origin proxy to the API.
  web:
    <<: *restart
    profiles: ["pipeline"]
    image: prognos/web:local
    build:
      context: apps/web
      secrets: [extra_ca]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 64m

  # ---------------------------------------------------------------------------
  # Schema migrations (one-shot, idempotent). dbmate applies plain SQL files and
  # records them in schema_migrations; re-running is a no-op.
  # ---------------------------------------------------------------------------
  migrate-postgres:
    image: amacneil/dbmate:2.28
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prognos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-prognos}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./database/postgres/migrations:/db/migrations:ro
    command: ["--wait", "up"]
    restart: "no"

  migrate-clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/db/migrate.sh", "up"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-prognos}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-telemetry}
      MIGRATIONS_DIR: /db/migrations
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
    volumes:
      - ./database/telemetry:/db:ro
    restart: "no"

  # ---------------------------------------------------------------------------
  # Observability (opt-in profile to save memory on small laptops)
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *restart
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 384m

  grafana:
    <<: *restart
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256m

# Optional CA bundle for image builds behind a TLS-intercepting proxy (see Dockerfiles).
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}

volumes:
  kafka-data:
  postgres-data:
  clickhouse-data:
  redis-data:
  prometheus-data:
  grafana-data:
