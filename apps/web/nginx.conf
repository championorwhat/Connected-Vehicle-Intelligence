# Static dashboard + same-origin reverse proxy to the API (no CORS needed).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;  # the API takes small JSON bodies only

    include /etc/nginx/security-headers.inc;

    location /v1/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Inherits the server-level headers; the API adds its own stricter CSP
        # (default-src 'none'). Browsers enforce both, so the stricter one wins.
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.inc;
    }
    # Client-side routes (e.g. /vehicles/<id>) all serve the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.inc;
    }
}
