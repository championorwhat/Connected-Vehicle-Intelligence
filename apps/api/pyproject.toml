[project]
name = "prognos-api"
version = "0.1.0"
description = "Prognos REST + WebSocket API: auth (RS256 JWT), RBAC, tenant isolation, alerts, work orders"
requires-python = ">=3.12,<3.14"
dependencies = [
    "prognos-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
    "argon2-cffi>=23.1",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    "clickhouse-connect>=0.8",
    "python-multipart>=0.0.20",
]

[project.scripts]
prognos-api = "prognos_api.main:main"

[tool.uv.sources]
prognos-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognos_api"]
