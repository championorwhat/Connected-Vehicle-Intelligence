[project]
name = "prognos-simulator"
version = "0.1.0"
description = "Prognos synthetic connected-vehicle telemetry simulator (100K+ vehicles, multi-OEM, fault injection)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "prognos-common",
    "numpy>=2.1",
    "orjson>=3.10",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
]

[project.scripts]
prognos-sim = "prognos_sim.main:main"

[tool.uv.sources]
prognos-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognos_sim"]
