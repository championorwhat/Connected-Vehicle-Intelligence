[project]
name = "prognos-common"
version = "0.1.0"
description = "Shared domain primitives for Prognos: VIN/DTC validation, geohash, reference catalog, deterministic fleet roster"
requires-python = ">=3.12,<3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognos_common"]
