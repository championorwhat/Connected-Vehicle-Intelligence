# name | partitions | topic configs (comma-separated key=value)
# ${VAR} placeholders are expanded by create-topics.sh from the environment.
# Keyed by vehicle_id everywhere => per-vehicle ordering within a partition.
telemetry.raw       | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=${KAFKA_TELEMETRY_RETENTION_MS},compression.type=producer
telemetry.canonical | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=${KAFKA_TELEMETRY_RETENTION_MS},compression.type=producer
telemetry.dlq       | 3                             | retention.ms=604800000
alerts              | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=604800000
vehicle.risk        | ${KAFKA_TELEMETRY_PARTITIONS} | cleanup.policy=compact
