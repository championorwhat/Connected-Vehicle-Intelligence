# name | partitions | topic configs (comma-separated key=value)
# ${VAR} placeholders are expanded by create-topics.sh from the environment.
# Keyed by vehicle_id everywhere => per-vehicle ordering within a partition.
# Telemetry segments are 128 MB (default 1 GB): retention deletes only closed segments, so
# with 1 GB segments up to ~1 GB per partition piled up regardless of retention.ms, and
# the disk of the load-test machine filled during M14 (evidence/load-tests).
telemetry.raw       | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=${KAFKA_TELEMETRY_RETENTION_MS},compression.type=producer,segment.bytes=134217728
telemetry.canonical | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=${KAFKA_TELEMETRY_RETENTION_MS},compression.type=producer,segment.bytes=134217728
telemetry.dlq       | 3                             | retention.ms=604800000
alerts              | ${KAFKA_TELEMETRY_PARTITIONS} | retention.ms=604800000
vehicle.risk        | ${KAFKA_TELEMETRY_PARTITIONS} | cleanup.policy=compact
# Latest health snapshot per vehicle (detector); compaction keeps one record per vehicle_id.
vehicle.state       | ${KAFKA_TELEMETRY_PARTITIONS} | cleanup.policy=compact,min.cleanable.dirty.ratio=0.1,segment.ms=600000
# Simulator ground truth (fault onsets, failures): evaluation labels, never read by the product path.
sim.truth           | 3                            | retention.ms=2592000000
# Emerging cross-vehicle fault patterns (radar), keyed by model/firmware/DTC.
fleet.signals       | 3                            | retention.ms=2592000000
