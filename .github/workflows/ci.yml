name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tests
      - run: uv run pytest tests/unit --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  compose:
    name: compose validate + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f infra/docker/compose.kafka-ha.yml config --quiet
      - name: start core stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: topics created
        run: |
          docker compose wait kafka-init
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 --list | tee topics.txt
          grep -q '^telemetry.raw$' topics.txt
          grep -q '^telemetry.dlq$' topics.txt
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - run: docker compose down -v
