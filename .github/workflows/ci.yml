name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tests packages/common/src database/postgres/seeds apps/simulator/src apps/stream-processor/src scripts/reconcile.py scripts/build_calibration.py scripts/bench_planner.py scripts/bench_radar.py
      - run: uv run pytest tests/unit tests/contract packages apps/simulator/tests apps/stream-processor/tests --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  integration:
    name: integration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest tests/integration --junitxml=integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: integration.xml

  compose:
    name: compose validate + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f infra/docker/compose.kafka-ha.yml config --quiet
      - name: start core stack (topics + migrations)
        run: ./scripts/up.sh
      - name: topics created
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 --list | tee topics.txt
          grep -q '^telemetry.raw$' topics.txt
          grep -q '^telemetry.dlq$' topics.txt
      - name: migrations applied
        run: |
          docker compose logs migrate-postgres migrate-clickhouse --no-color
          docker compose exec -T postgres psql -U prognos -d prognos -tAc \
            "SELECT count(*) FROM schema_migrations" | grep -qx 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: seed 100K vehicles
        run: |
          uv sync --group dev
          ./scripts/seed.sh --vehicles 100000 --evidence seed-100k.json
          docker compose exec -T postgres psql -U prognos -d prognos -tAc \
            "SELECT count(*) FROM vehicles" | grep -qx 100000
      - name: pipeline (simulator -> normalizer -> detector -> sinks) on the 100K seed
        env:
          VEHICLE_COUNT: "100000"      # must match the seed above
          EVENTS_PER_SECOND: "10000"
        run: |
          docker compose --profile pipeline build
          docker compose --profile pipeline up -d normalizer detector sink radar
          docker compose --profile pipeline run --rm -e DURATION_SECONDS=20 -e METRICS_PORT=0 \
            simulator --summary /tmp/sim.json
          group_lag() { docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server kafka:19092 --describe --group "$1" 2>/dev/null \
            | awk 'NR>1 && $6 ~ /^[0-9]+$/ {s+=$6} END {print s+0}'; }
          for i in $(seq 1 45); do
            lag=$(group_lag normalizer); dlag=$(group_lag detector); rlag=$(group_lag radar)
            echo "lag normalizer=$lag detector=$dlag radar=$rlag"
            [ "$lag" = "0" ] && [ "$dlag" = "0" ] && [ "$rlag" = "0" ] && break; sleep 2
          done
          count() { docker compose exec -T kafka /opt/kafka/bin/kafka-get-offsets.sh \
            --bootstrap-server kafka:19092 --topic "$1" | awk -F: '{s+=$3} END {print s+0}'; }
          raw=$(count telemetry.raw); canonical=$(count telemetry.canonical); dlq=$(count telemetry.dlq)
          alerts=$(count alerts); states=$(count vehicle.state)
          echo "raw=$raw canonical=$canonical dlq=$dlq dropped_duplicates=$((raw-canonical-dlq))"
          echo "alerts=$alerts vehicle.state=$states"
          [ "$lag" = "0" ] && [ "$dlag" = "0" ] && [ "$rlag" = "0" ] && [ "$canonical" -gt 150000 ] && [ "$dlq" -gt 0 ] \
            && [ "$alerts" -gt 0 ] && [ "$states" -gt 0 ]
      - name: reconcile Kafka vs ClickHouse vs PostgreSQL (no data loss)
        run: |
          set -a; . ./.env; set +a
          uv run python scripts/reconcile.py scripts/build_calibration.py scripts/bench_planner.py scripts/bench_radar.py --wait-seconds 240 --output reconciliation.json
      - name: planner proposes work orders once (idempotent re-run)
        run: |
          psql() { docker compose exec -T postgres psql -U prognos -d prognos -tAc "$1"; }
          docker compose --profile pipeline run --rm planner --once --output /dev/stdout
          first=$(psql "SELECT count(*) FROM work_orders WHERE status = 'proposed'")
          audit=$(psql "SELECT count(*) FROM audit_log WHERE action = 'work_order.propose'")
          docker compose --profile pipeline run --rm planner --once > /dev/null
          second=$(psql "SELECT count(*) FROM work_orders WHERE status = 'proposed'")
          money=$(psql "SELECT count(*) FROM work_orders WHERE expected_cost_avoided IS NOT NULL")
          echo "proposed=$first audit=$audit after_rerun=$second with_money=$money"
          [ "$first" -gt 0 ] && [ "$audit" = "$first" ] && [ "$second" = "$first" ] && [ "$money" = "0" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation
          path: reconciliation.json
      - uses: actions/upload-artifact@v4
        with:
          name: seed-100k-ci
          path: seed-100k.json
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - run: docker compose down -v
