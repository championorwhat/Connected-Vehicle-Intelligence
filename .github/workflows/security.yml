name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly re-scan for new CVEs

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/python --config p/dockerfile --config p/secrets --error

  iac-and-deps:
    name: IaC + dependency scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned Trivy image rather than the wrapper action: one less third-party action
      # in the supply chain, and the same command runs locally (scripts/security-scan.sh).
      - name: trivy fs scan
        # Gate (M12 baseline: 0 HIGH/CRITICAL findings). A new one fails the build; an
        # accepted risk goes in .trivyignore with a reason and an expiry date.
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/src aquasec/trivy:0.67.2 fs \
            --scanners vuln,misconfig,secret --severity CRITICAL,HIGH \
            --ignorefile /src/.trivyignore --exit-code 1 --format table /src | tee trivy-fs.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.txt
