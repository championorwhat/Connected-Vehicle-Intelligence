# Weekly update PRs; CI and the Trivy gate check each one.
# Minor and patch updates arrive as one grouped PR per ecosystem. Major versions are
# ignored here: they need a deliberate migration (read the changelog, run the full
# suite), not a routine bump. Security advisories still produce PRs for any version.
# The Python base image stays on 3.12, the version the lockfile and CI are tested with.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/simulator, /apps/stream-processor, /apps/web, /ml]
    schedule: { interval: weekly }
    groups:
      base-images: { update-types: [patch] }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "*"
        update-types: [version-update:semver-major]
